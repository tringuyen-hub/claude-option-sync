[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-option"
version = "0.1.0"
description = "Synchronized AskUserQuestion selection across Claude Code (VS Code) and Telegram"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tri Nguyen" }]
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
claude-option = "claude_option.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
